# SSH configuration
#
# Kamal uses SSH to connect and run commands on your hosts.
# By default, it will attempt to connect to the root user on port 22.
#
# If you are using a non-root user, you may need to bootstrap your servers manually before using them with Kamal. On Ubuntu, you’d do:
#
# ```shell
# sudo apt update
# sudo apt upgrade -y
# sudo apt install -y docker.io curl git
# sudo usermod -a -G docker app
# ```

# SSH options
#
# The options are specified under the ssh key in the configuration file.
ssh:

  # The SSH user
  #
  # Defaults to `root`:
  user: app

  # The SSH port
  #
  # Defaults to 22:
  port: "2222"

  # Proxy host
  #
  # Specified in the form <host> or <user>@<host>:
  proxy: root@proxy-host

  # Proxy command
  #
  # A custom proxy command, required for older versions of SSH:
  proxy_command: "ssh -W %h:%p user@proxy"

  # Log level
  #
  # Defaults to `fatal`. Set this to `debug` if you are having SSH connection issues.
  log_level: debug

  # Keys only
  #
  # Set to `true` to use only private keys from the `keys` and `key_data` parameters,
  # even if ssh-agent offers more identities. This option is intended for
  # situations where ssh-agent offers many different identities or you
  # need to overwrite all identities and force a single one.
  # When `keys` / `key_data` yield keys, Kamal.NET already does not mix in agent
  # or default identity files (see credential priority below).
  keys_only: false

  # Keys
  #
  # An array of file names of private keys to use for public key
  # and host-based authentication. When `keys` and/or `key_data` are set,
  # Kamal fails closed if none load successfully (no fall-through to env,
  # agent, or default identity files):
  keys: [ "~/.ssh/id.pem" ]

  # Key data
  #
  # An array of strings, with each element of the array being a secret name.
  # First-class for secret-manager and CI setups that inject key material into
  # Kamal secrets rather than the process environment or ssh-agent.
  key_data:
    - SSH_PRIVATE_KEY
  # You can also provide raw private key in PEM format, but this is deprecated.
  key_data:
    - "-----BEGIN OPENSSH PRIVATE KEY----- ..."

  # Credential sources and priority
  #
  # Kamal.NET authenticates with private keys only (no password auth). Sources,
  # highest priority first — the first source that yields keys is used alone
  # (lower sources are not mixed in):
  #
  # 1. Explicit `keys` paths and `key_data` (secret names or deprecated inline PEM).
  #    If either is configured, missing or unreadable keys are an auth failure
  #    (exit 11); lower sources are not tried.
  # 2. `KAMAL_SSH_PRIVATE_KEY` environment variable (full PEM private key text)
  # 3. ssh-agent identities (`SSH_AUTH_SOCK` on Unix; OpenSSH agent pipe on Windows)
  # 4. Default `~/.ssh/id_ed25519`, `id_ecdsa`, `id_rsa`, `id_dsa` when nothing
  #    above is configured / yields keys
  #
  # CI examples:
  # - Load a key into ssh-agent (e.g. webfactory/ssh-agent) and omit `keys`/`key_data`
  # - Or set `KAMAL_SSH_PRIVATE_KEY` to the PEM without writing a key file
  # - Or put the PEM in secrets and reference it from `key_data`
  #
  # Wrong or missing usable credentials fail as auth (class auth / exit 11).

  # Passphrase-protected keys
  #
  # Encrypted private keys (configured `keys` / `key_data`, `KAMAL_SSH_PRIVATE_KEY`,
  # or default `~/.ssh/id_*`) are never silently skipped solely because they need a
  # passphrase. Supply a passphrase via (first match wins):
  #
  # 1. `KAMAL_SSH_PASSPHRASE` environment variable
  # 2. `ssh.passphrase` — secret name (preferred) or literal value
  # 3. Interactive prompt — only when a TTY is present (not in typical CI)
  #
  # Non-interactive runs without a passphrase fail immediately as an auth failure
  # (exit 11; no hang on a prompt). Prefer unencrypted keys, ssh-agent, or
  # `KAMAL_SSH_PRIVATE_KEY` / `key_data` without a passphrase in CI.
  passphrase: SSH_KEY_PASSPHRASE

  # Host key verification
  #
  # Default is permissive: unknown host keys are accepted (existing deploys keep
  # working). Set `strict_host_key_checking` to true to verify remote host keys
  # against OpenSSH known_hosts file(s). When strict and `known_hosts` is omitted,
  # `~/.ssh/known_hosts` is used. Verification uses the logical host name (including
  # when connecting through a jump host).
  strict_host_key_checking: false
  known_hosts: "~/.ssh/known_hosts"

  # Config
  #
  # Set to true to load the default OpenSSH config files (~/.ssh/config,
  # /etc/ssh_config), to false ignore config files, or to a file path
  # (or array of paths) to load specific configuration. Defaults to true.
  config: [ "~/.ssh/myconfig" ]

  # Forward agent
  #
  # Whether to forward the local SSH agent to the remote host. Defaults to
  # true (sshkit's default). Set to false when connecting through a jump
  # host or tunnel that does not support agent forwarding (for example,
  # Cloudflare Access for Infrastructure with SSH).
  forward_agent: false
